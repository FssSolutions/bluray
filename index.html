<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blu-ray Collection Organizer</title>
<style>
  :root{
    --bg:#0d1016; --panel:#161b24; --panel-2:#1d2430; --line:#2a3340;
    --txt:#e7ecf3; --mut:#8a98ab; --acc:#4ea1ff; --acc-2:#2f6fd0;
    --film:#e0a13c; --digital:#52c1c9; --imax:#c95273; --anim:#8a6cf0;
    --good:#3ecf8e; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--acc)}
  header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg,rgba(13,16,22,.98),rgba(13,16,22,.92));
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 20px;
  }
  .bar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:1280px; margin:0 auto}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-right:6px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
  .grow{flex:1}
  input,select,button,textarea{font-family:inherit; font-size:14px}
  .field{
    background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
    border-radius:9px; padding:9px 12px; outline:none;
  }
  .field:focus{border-color:var(--acc)}
  #search{min-width:200px}
  .btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--txt);
    border-radius:9px; padding:9px 14px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{border-color:var(--acc); color:#fff}
  .btn.primary{background:var(--acc-2); border-color:var(--acc-2); color:#fff; font-weight:600}
  .btn.primary:hover{background:var(--acc)}
  .btn.ghost{background:transparent}
  .addrow{display:flex; gap:8px; max-width:1280px; margin:10px auto 0}
  #addTitle{flex:1; min-width:160px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; max-width:1280px; margin:12px auto 0}
  .chip{
    background:var(--panel); border:1px solid var(--line); color:var(--mut);
    padding:6px 13px; border-radius:999px; cursor:pointer; font-size:13px;
  }
  .chip.active{color:#fff; border-color:var(--acc); background:var(--panel-2)}
  .chip .c{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  main{max-width:1280px; margin:0 auto; padding:22px 20px 80px}
  .meta{color:var(--mut); font-size:13px; margin:4px 0 16px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:18px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; transition:transform .12s, border-color .12s;
    display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--acc)}
  .poster{aspect-ratio:2/3; background:var(--panel-2); position:relative; overflow:hidden}
  .poster img{width:100%; height:100%; object-fit:cover; display:block}
  .poster .ph{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:14px;color:var(--mut);font-weight:600;font-size:15px;
    background:radial-gradient(120% 80% at 50% 0%,#222c3a,#141a23);
  }
  .badge{
    position:absolute; top:8px; left:8px; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:6px; color:#0d1016; letter-spacing:.3px;
  }
  .card .body{padding:11px 12px 13px}
  .card .t{font-weight:600; line-height:1.25; font-size:14px}
  .card .sub{color:var(--mut); font-size:12.5px; margin-top:3px}
  .card .rt{margin-top:7px; font-size:12px; color:var(--warn)}
  .empty{text-align:center; color:var(--mut); padding:60px 20px}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(5,7,11,.72); backdrop-filter:blur(3px); z-index:50; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto}
  .overlay.open{display:flex}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:860px; overflow:hidden;
  }
  .mhead{display:flex; gap:20px; padding:22px; background:linear-gradient(180deg,var(--panel-2),var(--panel))}
  .mhead .mp{width:150px; flex:none; border-radius:10px; overflow:hidden; aspect-ratio:2/3; background:#10151d}
  .mhead .mp img{width:100%;height:100%;object-fit:cover}
  .mhead .mp .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;text-align:center;padding:10px;font-size:13px}
  .mtitle{font-size:24px; font-weight:700; line-height:1.2}
  .mline{color:var(--mut); margin-top:6px; font-size:14px}
  .pills{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
  .pill{font-size:12px; padding:4px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--txt)}
  .pill.rate{color:var(--warn); border-color:#4a3d23}
  .plot{padding:0 22px 6px; color:#cdd6e2}
  .section{padding:18px 22px}
  .section h3{margin:0 0 12px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc)}
  .specs{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:620px){.specs{grid-template-columns:1fr} .mhead{flex-direction:column} .mhead .mp{width:120px}}
  .spec{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .spec .k{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin-bottom:5px}
  .spec .v{font-size:14px; line-height:1.4}
  .spec .v.unknown{color:var(--warn); font-style:italic}
  .info{display:grid; grid-template-columns:1fr 1fr; gap:10px 22px}
  .info .row{display:flex; gap:10px; border-bottom:1px solid var(--line); padding:7px 0}
  .info .row .k{color:var(--mut); width:90px; flex:none; font-size:13px}
  .mfoot{display:flex; gap:10px; padding:16px 22px 22px; border-top:1px solid var(--line); flex-wrap:wrap}
  .mfoot .grow{flex:1}
  .x{position:absolute; top:14px; right:16px; cursor:pointer; color:var(--mut); font-size:26px; line-height:1; z-index:2}
  .x:hover{color:#fff}
  .modal-wrap{position:relative}

  /* edit form */
  .editrow{display:grid; grid-template-columns:130px 1fr; gap:10px; align-items:center; margin-bottom:10px}
  .editrow label{color:var(--mut); font-size:13px}
  .editrow input, .editrow select, .editrow textarea{width:100%}
  textarea.field{resize:vertical; min-height:60px}
  @media(max-width:620px){.editrow{grid-template-columns:1fr; gap:4px} .info{grid-template-columns:1fr}}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line); padding:12px 18px; border-radius:10px; z-index:99; box-shadow:0 8px 30px rgba(0,0,0,.5); display:none}
  .toast.show{display:block}
  .hint{color:var(--mut); font-size:12.5px; margin-top:8px}
  code{background:var(--panel-2); padding:2px 6px; border-radius:5px; font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span> Blu-ray Collection</div>
    <input id="search" class="field" placeholder="Search title, director, format…">
    <select id="sort" class="field">
      <option value="title">Sort: Title A–Z</option>
      <option value="year">Sort: Year (newest)</option>
      <option value="yearOld">Sort: Year (oldest)</option>
      <option value="rating">Sort: Rating</option>
      <option value="director">Sort: Director</option>
    </select>
    <div class="grow"></div>
    <button class="btn" id="settingsBtn" title="Set up online lookup">⚙ Setup</button>
    <button class="btn" id="exportBtn">Export</button>
    <button class="btn" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="addrow">
    <input id="addTitle" class="field" placeholder="Add a film — just type the title and press Enter…">
    <button class="btn primary" id="addBtn">+ Add film</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="meta" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No films match. Try clearing the search or filters.</div>
</main>

<!-- Detail / edit modal -->
<div class="overlay" id="overlay">
  <div class="modal modal-wrap">
    <span class="x" id="closeBtn">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

function seedToFilm(r, i){
  return {
    id:"seed-"+i, title:r[0], year:r[1], director:r[2], genres:r[3],
    runtime:r[4], rating:r[5], cast:r[6], plot:r[7],
    format:r[8], cameras:r[9], lenses:r[10], filmstock:r[11], resolution:r[12],
    poster:""
  };
}

/* ---------- State ---------- */
const LS_FILMS="bluray.films.v1", LS_KEY="bluray.tmdbkey";
let films = load();
let filter = {q:"", format:"all", sort:"title"};

function load(){
  try{
    const raw = localStorage.getItem(LS_FILMS);
    if(raw){ const a = JSON.parse(raw); if(Array.isArray(a) && a.length) return a; }
  }catch(e){}
  return SEED.map(seedToFilm);
}
function save(){ localStorage.setItem(LS_FILMS, JSON.stringify(films)); }
function tmdbKey(){ return localStorage.getItem(LS_KEY) || ""; }

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function formatClass(f){
  f=(f||"").toLowerCase();
  if(f.includes("imax")) return "imax";
  if(f.includes("anim")) return "anim";
  if(f.includes("digital")) return "digital";
  if(f.includes("film")) return "film";
  return "digital";
}
const FORMAT_COLORS={film:"var(--film)",digital:"var(--digital)",imax:"var(--imax)",anim:"var(--anim)"};
const FORMAT_LABELS={film:"FILM",digital:"DIGITAL",imax:"IMAX",anim:"ANIMATED"};

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600); }

/* ---------- Filters / chips ---------- */
const FILTERS=[
  {k:"all",label:"All"},
  {k:"film",label:"Shot on Film"},
  {k:"digital",label:"Shot on Digital"},
  {k:"imax",label:"IMAX"},
  {k:"anim",label:"Animated"},
];
function renderChips(){
  $("#chips").innerHTML = FILTERS.map(f=>{
    const dot = f.k!=="all" ? `<span class="c" style="background:${FORMAT_COLORS[f.k]}"></span>` : "";
    return `<div class="chip ${filter.format===f.k?'active':''}" data-f="${f.k}">${dot}${f.label}</div>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter.format=c.dataset.f; renderChips(); render();});
}

/* ---------- Grid ---------- */
function visibleFilms(){
  let list = films.slice();
  if(filter.format!=="all") list=list.filter(f=>formatClass(f.format)===filter.format);
  if(filter.q){
    const q=filter.q.toLowerCase();
    list=list.filter(f=>[f.title,f.director,f.format,f.cameras,f.genres,f.cast].join(" ").toLowerCase().includes(q));
  }
  const s=filter.sort;
  list.sort((a,b)=>{
    if(s==="year") return (b.year||0)-(a.year||0);
    if(s==="yearOld") return (a.year||0)-(b.year||0);
    if(s==="rating") return (b.rating||0)-(a.rating||0);
    if(s==="director") return (a.director||"").localeCompare(b.director||"");
    return a.title.localeCompare(b.title);
  });
  return list;
}
function posterHTML(f, cls){
  if(f.poster) return `<img src="${esc(f.poster)}" alt="${esc(f.title)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc(f.title).replace(/'/g,"")}'}))">`;
  return `<div class="ph">${esc(f.title)}</div>`;
}
function render(){
  const list=visibleFilms();
  $("#count").textContent = `${list.length} of ${films.length} film${films.length!==1?"s":""}`;
  $("#empty").style.display = list.length? "none":"block";
  $("#grid").innerHTML = list.map(f=>{
    const fc=formatClass(f.format);
    return `<div class="card" data-id="${f.id}">
      <div class="poster">
        <span class="badge" style="background:${FORMAT_COLORS[fc]}">${FORMAT_LABELS[fc]}</span>
        ${posterHTML(f)}
      </div>
      <div class="body">
        <div class="t">${esc(f.title)}</div>
        <div class="sub">${f.year||"—"} · ${esc(f.director||"Unknown")}</div>
        ${f.rating?`<div class="rt">★ ${f.rating}</div>`:""}
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

/* ---------- Detail modal ---------- */
function specBlock(k,v){
  const unknown = !v || /^unknown/i.test(v);
  return `<div class="spec"><div class="k">${k}</div><div class="v ${unknown?'unknown':''}">${unknown?'Unknown — click Edit to add':esc(v)}</div></div>`;
}
function openDetail(id){
  const f=films.find(x=>x.id===id); if(!f) return;
  const fc=formatClass(f.format);
  $("#modalBody").innerHTML=`
    <div class="mhead">
      <div class="mp">${posterHTML(f)}</div>
      <div>
        <div class="mtitle">${esc(f.title)}</div>
        <div class="mline">${f.year||"—"} · ${esc(f.director||"Unknown director")} · ${f.runtime?f.runtime+" min":""}</div>
        <div class="pills">
          ${f.rating?`<span class="pill rate">★ ${f.rating} / 10</span>`:""}
          <span class="pill" style="border-color:${FORMAT_COLORS[fc]};color:${FORMAT_COLORS[fc]}">${FORMAT_LABELS[fc]}</span>
          ${(f.genres||"").split(",").map(g=>g.trim()).filter(Boolean).map(g=>`<span class="pill">${esc(g)}</span>`).join("")}
        </div>
      </div>
    </div>
    ${f.plot?`<div class="section"><p class="plot" style="padding:0;margin:0">${esc(f.plot)}</p></div>`:""}
    <div class="section" style="padding-top:4px">
      <div class="info">
        <div class="row"><span class="k">Director</span><span>${esc(f.director||"—")}</span></div>
        <div class="row"><span class="k">Year</span><span>${f.year||"—"}</span></div>
        <div class="row"><span class="k">Runtime</span><span>${f.runtime?f.runtime+" min":"—"}</span></div>
        <div class="row"><span class="k">Genre</span><span>${esc(f.genres||"—")}</span></div>
        <div class="row" style="grid-column:1/-1"><span class="k">Cast</span><span>${esc(f.cast||"—")}</span></div>
      </div>
    </div>
    <div class="section">
      <h3>◎ Shot On — Cinematography</h3>
      <div class="specs">
        ${specBlock("Cameras",f.cameras)}
        ${specBlock("Lenses",f.lenses)}
        ${specBlock("Format / Film stock",f.filmstock)}
        ${specBlock("Resolution / Finish",f.resolution)}
      </div>
    </div>
    <div class="mfoot">
      <button class="btn" id="editBtn">✎ Edit</button>
      <div class="grow"></div>
      <button class="btn ghost" id="deleteBtn" style="color:#e0738a;border-color:#5a2f3a">Delete</button>
    </div>`;
  $("#editBtn").onclick=()=>openEdit(id);
  $("#deleteBtn").onclick=()=>{
    if(confirm(`Remove "${f.title}" from your collection?`)){
      films=films.filter(x=>x.id!==id); save(); closeModal(); render(); toast("Removed");
    }
  };
  openModal();
}

/* ---------- Edit form ---------- */
function field(id,label,val,ta){
  const input = ta
    ? `<textarea class="field" id="ed-${id}">${esc(val||"")}</textarea>`
    : `<input class="field" id="ed-${id}" value="${esc(val||"")}">`;
  return `<div class="editrow"><label>${label}</label>${input}</div>`;
}
function openEdit(id){
  const f = films.find(x=>x.id===id) || {id:id};
  const isNew = !films.find(x=>x.id===id);
  $("#modalBody").innerHTML=`
    <div class="section">
      <h3>${isNew?"Add film":"Edit film"}</h3>
      ${field("title","Title",f.title)}
      ${field("year","Year",f.year)}
      ${field("director","Director",f.director)}
      ${field("genres","Genre",f.genres)}
      ${field("runtime","Runtime (min)",f.runtime)}
      ${field("rating","Rating /10",f.rating)}
      ${field("cast","Cast",f.cast)}
      ${field("poster","Poster URL",f.poster)}
      ${field("plot","Synopsis",f.plot,true)}
    </div>
    <div class="section" style="padding-top:0">
      <h3>◎ Shot On</h3>
      <div class="editrow"><label>Format</label>
        <select class="field" id="ed-format">
          ${["Film","Digital","Film + IMAX","Digital + IMAX","Animation"].map(o=>`<option ${f.format===o?"selected":""}>${o}</option>`).join("")}
        </select>
      </div>
      ${field("cameras","Cameras",f.cameras)}
      ${field("lenses","Lenses",f.lenses)}
      ${field("filmstock","Format / Film stock",f.filmstock)}
      ${field("resolution","Resolution / Finish",f.resolution)}
    </div>
    <div class="mfoot">
      <button class="btn primary" id="saveBtn">Save</button>
      <button class="btn" id="cancelBtn">Cancel</button>
    </div>`;
  $("#saveBtn").onclick=()=>{
    const get=k=>{const el=$("#ed-"+k);return el?el.value.trim():"";};
    const obj={
      id:f.id||("usr-"+Date.now()),
      title:get("title")||"Untitled", year:parseInt(get("year"))||"", director:get("director"),
      genres:get("genres"), runtime:parseInt(get("runtime"))||"", rating:parseFloat(get("rating"))||"",
      cast:get("cast"), poster:get("poster"), plot:get("plot"),
      format:get("format"), cameras:get("cameras"), lenses:get("lenses"),
      filmstock:get("filmstock"), resolution:get("resolution"),
    };
    const idx=films.findIndex(x=>x.id===obj.id);
    if(idx>=0) films[idx]=obj; else films.push(obj);
    save(); render(); openDetail(obj.id); toast("Saved");
  };
  $("#cancelBtn").onclick=()=> isNew? closeModal() : openDetail(id);
  openModal();
}

/* ---------- Add by title (local DB + optional online fetch) ---------- */
async function addByTitle(title){
  title=title.trim(); if(!title) return;
  // 1) already in collection?
  const existing=films.find(f=>norm(f.title)===norm(title));
  if(existing){ toast("Already in your collection"); openDetail(existing.id); return; }
  // 2) known in built-in seed DB (basics + shot-on)?
  const seedRow=SEED.find(r=>norm(r[0])===norm(title) || norm(r[0]).includes(norm(title)) && norm(title).length>5);
  if(seedRow){
    const f=seedToFilm(seedRow, "x"); f.id="usr-"+Date.now();
    films.push(f); save(); render(); $("#addTitle").value=""; openDetail(f.id); toast("Added from built-in database");
    return;
  }
  // 3) online lookup for basics (shot-on left blank to fill in)
  const key=tmdbKey();
  if(key){
    toast("Looking up online…");
    try{
      const f=await fetchTMDB(title,key);
      films.push(f); save(); render(); $("#addTitle").value=""; openDetail(f.id);
      toast("Pulled basics online — add the Shot On details");
      return;
    }catch(e){ toast("Online lookup failed: "+e.message); }
  }
  // 4) fallback: blank card to edit
  const f={id:"usr-"+Date.now(),title:title,format:"Digital",cameras:"Unknown",lenses:"Unknown",filmstock:"Unknown",resolution:"Unknown"};
  films.push(f); save(); render(); $("#addTitle").value="";
  openEdit(f.id);
  if(!key) toast("Added blank — click ⚙ Setup to enable online lookup");
}
async function fetchTMDB(title,key){
  const s=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${key}&query=${encodeURIComponent(title)}`);
  if(!s.ok) throw new Error("HTTP "+s.status);
  const sj=await s.json();
  if(!sj.results || !sj.results.length) throw new Error("no match");
  const id=sj.results[0].id;
  const d=await (await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${key}&append_to_response=credits`)).json();
  const dir=(d.credits&&d.credits.crew||[]).find(c=>c.job==="Director");
  const cast=(d.credits&&d.credits.cast||[]).slice(0,4).map(c=>c.name).join(", ");
  return {
    id:"usr-"+Date.now(),
    title:d.title||title,
    year:d.release_date?parseInt(d.release_date.slice(0,4)):"",
    director:dir?dir.name:"",
    genres:(d.genres||[]).map(g=>g.name).join(", "),
    runtime:d.runtime||"",
    rating:d.vote_average?Math.round(d.vote_average*10)/10:"",
    cast:cast,
    plot:d.overview||"",
    poster:d.poster_path?`https://image.tmdb.org/t/p/w500${d.poster_path}`:"",
    format:"Digital",
    cameras:"Unknown — no online source for this; add manually",
    lenses:"Unknown", filmstock:"Unknown", resolution:"Unknown"
  };
}

/* ---------- Settings (TMDB key) ---------- */
function openSettings(){
  $("#modalBody").innerHTML=`
    <div class="section">
      <h3>⚙ Online Lookup Setup</h3>
      <p class="plot" style="padding:0">When you add a new title, the app can pull <b>IMDb-style basics</b>
      (year, director, cast, genre, runtime, synopsis, poster, rating) automatically from
      <a href="https://www.themoviedb.org" target="_blank">The Movie Database</a>.</p>
      <p class="hint">The four <b>Shot On</b> fields (cameras, lenses, format, resolution) have no free
      public API anywhere, so those stay manual — your 26 starter films already have them filled in from a built-in database.</p>
      <ol class="hint" style="line-height:1.8">
        <li>Make a free account at <a href="https://www.themoviedb.org/signup" target="_blank">themoviedb.org/signup</a></li>
        <li>Go to Settings → API → request an API key (instant, free)</li>
        <li>Paste the <b>API Read key (v3 auth)</b> below</li>
      </ol>
      ${field("tmdb","API key",tmdbKey())}
      <p class="hint">Stored only in this browser. Leave blank to keep everything offline/manual.</p>
    </div>
    <div class="mfoot">
      <button class="btn primary" id="saveKey">Save</button>
      <button class="btn" id="closeSettings">Close</button>
      <div class="grow"></div>
      <button class="btn ghost" id="resetSeed" style="color:#e0738a;border-color:#5a2f3a">Reset to 26 starter films</button>
    </div>`;
  $("#saveKey").onclick=()=>{localStorage.setItem(LS_KEY,$("#ed-tmdb").value.trim()); closeModal(); toast("Saved");};
  $("#closeSettings").onclick=closeModal;
  $("#resetSeed").onclick=()=>{ if(confirm("Replace your collection with the original 26 starter films? Your additions/edits will be lost.")){ films=SEED.map(seedToFilm); save(); render(); closeModal(); toast("Reset to starter collection"); } };
  openModal();
}

/* ---------- Modal plumbing ---------- */
function openModal(){ $("#overlay").classList.add("open"); }
function closeModal(){ $("#overlay").classList.remove("open"); }
$("#closeBtn").onclick=closeModal;
$("#overlay").onclick=e=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- Export / Import ---------- */
$("#exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(films,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="bluray-collection.json"; a.click(); toast("Exported JSON");
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const a=JSON.parse(r.result); if(Array.isArray(a)){ films=a; save(); render(); toast("Imported "+a.length+" films"); } else toast("Invalid file"); }catch(err){ toast("Could not read file"); } };
  r.readAsText(file);
};

/* ---------- Wire up ---------- */
$("#search").oninput=e=>{filter.q=e.target.value; render();};
$("#sort").onchange=e=>{filter.sort=e.target.value; render();};
$("#addBtn").onclick=()=>addByTitle($("#addTitle").value);
$("#addTitle").onkeydown=e=>{ if(e.key==="Enter") addByTitle($("#addTitle").value); };
$("#settingsBtn").onclick=openSettings;

renderChips();
render();
</script>
